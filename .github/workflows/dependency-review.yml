name: Dependency Review

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
      
      - name: Dependency Review Status
        if: always()
        run: |
          echo "Dependency review completed (or skipped if GitHub Advanced Security is not enabled)"
          echo "This check will pass regardless to allow CI to continue"
