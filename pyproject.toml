[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-coach-pose-estimation"
version = "0.1.0"
description = "Computer vision analytics pipeline for extracting biomechanical and safety metrics from training videos"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Smart Coach Pose Estimation Contributors"}
]
maintainers = [
    {name = "Smart Coach Pose Estimation Contributors"}
]
keywords = [
    "computer-vision",
    "pose-estimation",
    "biomechanics",
    "sports-analytics",
    "motion-tracking",
    "yolo",
    "mediapipe"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video"
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mediapipe>=0.10.0",
    "ultralytics>=8.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "safety>=2.3.0"
]

[project.urls]
Homepage = "https://github.com/VidiVici98/Smart_Coach_Pose_Estimation"
Repository = "https://github.com/VidiVici98/Smart_Coach_Pose_Estimation"
Documentation = "https://github.com/VidiVici98/Smart_Coach_Pose_Estimation/tree/main/docs"
"Bug Tracker" = "https://github.com/VidiVici98/Smart_Coach_Pose_Estimation/issues"

[tool.setuptools]
packages = ["smart_coach", "smart_coach.constants", "smart_coach.core", "smart_coach.metrics", "smart_coach.models", "smart_coach.utils", "smart_coach.visualization"]

[tool.setuptools.package-data]
smart_coach = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | mediapipe_env
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "mediapipe_env", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=smart_coach",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]

[tool.pylint.main]
py-version = "3.10"
ignore = [".venv", "mediapipe_env", "build", "dist"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring"
]

[tool.bandit]
exclude_dirs = [".venv", "mediapipe_env", "tests"]
skips = ["B101"]
